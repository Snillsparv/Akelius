const CAT_COLORS = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)'];
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cardNo = 0;
DATA.forEach(set => {
  const h = document.createElement('h2');
  h.className = 'person-head';
  h.innerHTML = '<strong>' + esc(set.person) + '</strong> 5 kort';
  app.appendChild(h);
  set.cards.forEach((c, i) => {
    const color = CAT_COLORS[(cardNo++) % CAT_COLORS.length];
    const sec = document.createElement('section');
    sec.className = 'sheet';
    sec.innerHTML =
      '<div class="sheet-meta">' +
        '<span class="lvl">' + esc(c.level) + '</span>' +
        '<span>' + esc(set.person) + ' · kort ' + (i + 1) + ' av 5</span>' +
        '<span>' + esc(c.title) + '</span>' +
      '</div>' +
      '<article class="card" style="--cat:' + color + '">' +
        '<div>' +
          '<figure class="ph ph-main"><span class="ph-tag">Huvudbild</span>' + esc(c.main_image.description) + '</figure>' +
          '<div class="card-text">' +
            c.text_sentences.map(s => '<p>' + esc(s) + '</p>').join('') +
            '<p class="q">' + esc(c.question) + '</p>' +
          '</div>' +
        '</div>' +
        '<aside>' +
          '<figure class="ph"><span class="ph-tag">Sidobild</span>' + esc(c.side_image.description) + '</figure>' +
          '<p class="caption">' + esc(c.side_image.caption) + '</p>' +
          (c.words.length ? '<dl class="words">' + c.words.map(w =>
            '<dt>' + esc(w.word) + '</dt><dd>' + esc(w.explanation) + '</dd>').join('') + '</dl>' : '') +
          '<h2 class="category">' + esc(c.category) + '</h2>' +
          '<ul class="options">' + c.options.map(o =>
            '<li' + (o === c.correct ? ' class="is-correct"' : '') + '><span class="sq"></span>' +
            esc(o) + '<span class="tick">✓ rätt svar</span></li>').join('') + '</ul>' +
        '</aside>' +
      '</article>' +
      '<details class="brief"><summary>Bildbriefer &amp; bildtexter</summary><div class="brief-body">' +
        ['main_image', 'side_image'].map((k, j) => {
          const img = c[k];
          return '<div><h3>' + (j ? 'Sidobild' : 'Huvudbild') + '</h3>' +
            '<p><b>Motiv:</b> ' + esc(img.description) + '</p>' +
            '<p><b>Bildtext:</b> ' + esc(img.caption) + '</p>' +
            '<p><b>Shutterstock:</b> ' + esc(img.shutterstock_query) + '</p>' +
            '<p><b>AI-prompt:</b> ' + esc(img.ai_prompt) + '</p></div>';
        }).join('') +
      '</div></details>';
    app.appendChild(sec);
  });
});
const facitBtn = document.getElementById('facitBtn');
facitBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('facit');
  facitBtn.setAttribute('aria-pressed', String(on));
  facitBtn.textContent = 'Facit: ' + (on ? 'på' : 'av');
});
</script>
